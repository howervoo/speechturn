name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make install
      - run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: speechturn-python-${{ matrix.python }}
          path: dist/*
